# Console Proxy Configuration for console.believoo.com
# Copy to: /www/server/panel/vhost/nginx/console.believoo.com.conf
# Then: sudo /etc/init.d/nginx reload

server {
    listen 80;
    server_name console.believoo.com;
    
    # Note: Using HTTP only for now. SSL termination at Cloudflare.
    # If SSL needed locally, configure certificates first.
    
    # Logs
    access_log /www/wwwlogs/console.believoo.com.log;
    error_log /www/wwwlogs/console.believoo.com.error.log;

    # Proxy to Laravel Console Controller
    location /console/ {
        proxy_pass http://127.0.0.1:8000/console/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket Proxy to Proxmox
    location /ws/ {
        # REPLACE THIS IP WITH YOUR PROXMOX IP
        proxy_pass https://139.99.122.47:8006/;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        
        proxy_ssl_verify off;
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:8000/console/health/;
        access_log off;
    }

    # Default - redirect to console
    location / {
        proxy_pass http://127.0.0.1:8000/console/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
