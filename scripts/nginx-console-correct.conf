# Console Proxy Configuration for console.believoo.com
# Copy to: /www/server/panel/vhost/nginx/console.believoo.com.conf
# Then: sudo /etc/init.d/nginx reload

server {
    listen 80;
    server_name console.believoo.com;
    
    # Root directory (same as main site)
    root /www/wwwroot/believoo/public;
    index index.php index.html;
    
    # Logs
    access_log /www/wwwlogs/console.believoo.com.log;
    error_log /www/wwwlogs/console.believoo.com.error.log;

    # WebSocket Proxy to Proxmox (must be before PHP location)
    location /ws/ {
        proxy_pass https://139.99.122.47:8006/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_buffering off;
        proxy_ssl_verify off;
    }

    # Laravel Console Routes - Proxy to PHP-FPM
    location /console/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP Processing (same as main site)
    location ~ \.php$ {
        fastcgi_pass unix:/tmp/php-cgi-82.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Default - Route to Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Security
    location ~ /\. {
        deny all;
    }
}
