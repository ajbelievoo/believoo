# Console Proxy Configuration for console.believoo.com
# With SSL support for Cloudflare

server {
    listen 80;
    listen 443 ssl http2;
    server_name console.believoo.com;
    
    # Use same SSL certificates as main site (or get separate ones)
    # Option 1: Use main site's certificate (if it covers *.believoo.com)
    # Option 2: Get separate certificate for console.believoo.com
    
    # For now, use self-signed or main site certs
    ssl_certificate /www/server/panel/vhost/cert/believoo.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/believoo.com/privkey.pem;
    
    # Modern SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    
    # Root directory
    root /www/wwwroot/believoo/public;
    index index.php index.html;
    
    # Logs
    access_log /www/wwwlogs/console.believoo.com.log;
    error_log /www/wwwlogs/console.believoo.com.error.log;

    # WebSocket Proxy to Proxmox (must be before PHP location)
    location /ws/ {
        proxy_pass https://139.99.122.47:8006/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_buffering off;
        proxy_ssl_verify off;
    }

    # Laravel Console Routes
    location /console/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP Processing
    location ~ \.php$ {
        fastcgi_pass unix:/tmp/php-cgi-82.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Default - Route to Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Security
    location ~ /\. {
        deny all;
    }
}
