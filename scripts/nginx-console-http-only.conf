# TEMPORARY - HTTP Only Config for console.believoo.com
# Use this if SSL certificates are not yet ready
# Copy to: /www/server/panel/vhost/nginx/console.believoo.com.conf

server {
    listen 80;
    server_name console.believoo.com;
    
    # Logs
    access_log /www/wwwlogs/console.believoo.com.log;
    error_log /www/wwwlogs/console.believoo.com.error.log;

    # Proxy to Laravel Console Controller
    location /console/ {
        proxy_pass http://127.0.0.1:8000/console/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket Proxy to Proxmox
    location /ws/ {
        proxy_pass https://139.99.122.47:8006/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_ssl_verify off;
    }

    # Default - redirect to console
    location / {
        proxy_pass http://127.0.0.1:8000/console/;
    }
}
