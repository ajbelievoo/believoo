# BelieVoo Live Engine - WebSocket Audio Configuration
# Fix for 502 Bad Gateway on WebSocket audio streams

upstream websocket_audio {
    least_conn;
    server 127.0.0.1:8080 max_fails=3 fail_timeout=30s;
    keepalive 64;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl http2;
    server_name admin.unilive.me;

    # SSL Configuration
    ssl_certificate /path/to/cert.pem;
    ssl_certificate_key /path/to/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # WebSocket Audio Endpoint - Critical Fix for 502
    location /ws/audio {
        proxy_pass http://websocket_audio;
        proxy_http_version 1.1;
        
        # Essential WebSocket Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket Timeout Settings
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
        
        # Buffer Settings for Audio Stream
        proxy_buffering off;
        proxy_cache off;
        
        # Error Handling
        proxy_intercept_errors on;
        error_page 502 = @audio_fallback;
    }
    
    # Native WebRTC Fallback (when WebSocket unstable)
    location @audio_fallback {
        return 302 https://admin.unilive.me/webrtc/audio$is_args$args;
    }
    
    # Native WebRTC Endpoint
    location /webrtc/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }
}
