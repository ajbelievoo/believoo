# Nginx Reverse Proxy Configuration for console.believoo.com
# Copy this to: /etc/nginx/sites-available/console.believoo.com
# Then: sudo ln -s /etc/nginx/sites-available/console.believoo.com /etc/nginx/sites-enabled/
# Test: sudo nginx -t
# Reload: sudo systemctl reload nginx

# IMPORTANT: This file must be loaded BEFORE the main believoo.com config
# Use: sudo ln -s /etc/nginx/sites-available/console.believoo.com /etc/nginx/sites-enabled/001-console

# HTTP to HTTPS redirect for console
server {
    listen 80;
    listen [::]:80;
    server_name console.believoo.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name console.believoo.com;

    # SSL Certificates (Let's Encrypt or your own)
    ssl_certificate /etc/letsencrypt/live/console.believoo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/console.believoo.com/privkey.pem;

    # Modern SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logs
    access_log /var/log/nginx/console.believoo.com.access.log;
    error_log /var/log/nginx/console.believoo.com.error.log;

    # Proxy to Laravel Console Controller
    location /console/ {
        proxy_pass http://127.0.0.1:8000/console/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket Proxy to Proxmox (CRITICAL - masks Proxmox IP)
    location /ws/ {
        # IMPORTANT: Replace YOUR_PROXMOX_IP with your actual Proxmox host IP
        proxy_pass https://YOUR_PROXMOX_IP:8006/;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket specific timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        
        # Buffer settings for WebSocket
        proxy_buffering off;
        proxy_cache off;
        
        # SSL verification (set to off if using self-signed certs on Proxmox)
        proxy_ssl_verify off;
        proxy_ssl_server_name off;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://127.0.0.1:8000/console/health/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Static assets (if any)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
